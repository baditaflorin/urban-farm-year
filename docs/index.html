<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A static, offline-friendly planner for garden calendars, daily care, harvest logs, and next-year growing decisions." />
    <title>Urban Farm Year</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f6f4ee;
        color: #1c201a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px;
      }

      main {
        width: min(760px, 100%);
        display: grid;
        gap: 22px;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 7vw, 5rem);
        line-height: 0.92;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        max-width: 62ch;
        color: #3f4638;
        font-size: 1.12rem;
        line-height: 1.6;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      a {
        color: #155e45;
        font-weight: 700;
        text-underline-offset: 4px;
      }

      .version {
        color: #66705f;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Urban Farm Year</h1>
      <p>
        Planning, planting calendars, daily care, harvest tracking, and next-year notes for small-space growers.
      </p>
      <nav aria-label="Project links">
        <a href="https://github.com/baditaflorin/urban-farm-year">Star on GitHub</a>
        <a href="https://www.paypal.com/paypalme/florinbadita">Support with PayPal</a>
      </nav>
      <p class="version">Version 0.1.0-dev · Commit local</p>
    </main>
  </body>
</html>
